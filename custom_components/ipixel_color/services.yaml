display_image:
  name: Display Image
  description: Send an image (PNG/JPG/GIF) to the iPIXEL display.
  fields:
    address:
      name: Device address
      description: Bluetooth MAC of the display (optional when only one is configured)
      required: false
      example: "92:6C:9F:33:50:93"
      selector:
        text:
    image:
      name: Image (base64)
      description: Image file content encoded as base64
      required: true
      selector:
        text:
          multiline: true
    resize_method:
      name: Resize method
      description: How to adapt the image to the panel
      required: false
      default: "crop"
      selector:
        select:
          options:
            - "crop"
            - "fit"
    file_extension:
      name: File extension
      description: Extension hint for decoding (.png, .jpg, .gif)
      required: false
      default: ".png"
      selector:
        text:
